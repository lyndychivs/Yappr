name: Deploy
run-name: "Deploy: ${{ github.ref_name }}"
permissions:
    contents: read
on:
    workflow_dispatch:
    workflow_call:
concurrency:
    group: deploy-production
    cancel-in-progress: false
jobs:
    deploy:
        name: Deploy
        runs-on: self-hosted
        timeout-minutes: 15
        environment: production
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Deploy
              run: docker compose -f deploy/docker-compose.yaml -f deploy/docker-compose.production.yml up -d --build
              env:
                  YAPPR_DISCORD_PORT: ${{ vars.YAPPR_DISCORD_PORT }}
                  ASPIRE_API_PORT: ${{ vars.ASPIRE_API_PORT }}
                  ASPIRE_OTLP_PORT: ${{ vars.ASPIRE_OTLP_PORT }}
                  DASHBOARD_OTLP_API_KEY: ${{ secrets.DASHBOARD_OTLP_API_KEY }}
                  DASHBOARD_FRONTEND_AUTHMODE: ${{ vars.DASHBOARD_FRONTEND_AUTHMODE }}
                  DASHBOARD_FRONTEND_BROWSERTOKEN: ${{ secrets.DASHBOARD_FRONTEND_BROWSERTOKEN }}
                  DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
                  DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
                  MCP_TRANSPORT: ${{ vars.MCP_TRANSPORT }}
                  MCP_COMMAND: ${{ vars.MCP_COMMAND }}
                  MCP_ARGUMENTS: ${{ vars.MCP_ARGUMENTS }}
                  MCP_HTTP_ENDPOINT: ${{ vars.MCP_HTTP_ENDPOINT }}
                  MCP_TOOL_NAME: ${{ vars.MCP_TOOL_NAME }}
                  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
